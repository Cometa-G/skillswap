<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages - SkillSwap</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-inner">
        <div class="sidebar-logo-icon">SS</div>
        <div class="sidebar-logo-text">
          <span class="sidebar-logo-name">Skill<span>Swap</span></span>
          <span class="sidebar-logo-tagline">Learn, Teach, Grow Together.</span>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a>
      <a href="find-tutor.html" class="sidebar-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Find Tutors
      </a>
      <a href="my-sessions.html" class="sidebar-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        My Sessions
      </a>
      <a href="messages.html" class="sidebar-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </a>
      <a href="notifications.html" class="sidebar-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notifications
      </a>
      <div class="sidebar-nav-divider"></div>
      <a href="login.html" class="sidebar-nav-item" style="color:#ef4444;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log-out
      </a>
    </nav>
    <div class="sidebar-help">
      <div class="sidebar-help-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      </div>
      <h5>Need Help?</h5>
      <p>Visit our Help Center or contact support</p>
    </div>
  </aside>

  <div class="dashboard-main">
    <header class="dashboard-header">
      <button class="icon-btn" id="sidebarToggle" style="display:none;" aria-label="Toggle navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="dashboard-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search tutors, subjects, or skills..." />
      </div>
      <div class="dashboard-header-actions">
        <a href="messages.html" class="icon-btn" aria-label="Messages">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a href="notifications.html" class="icon-btn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>
        <div class="dashboard-user">
          <div class="avatar-placeholder avatar-md green" style="font-size:14px;">SS</div>
          <div class="dashboard-user-info">
            <span class="dashboard-user-name">SkillSwap User</span>
            <span class="dashboard-user-role">Student</span>
          </div>
        </div>
      </div>
    </header>
    <main id="messagingRoot"></main>
  </div>
</div>

<script>
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 768) sidebarToggle.style.display = 'flex';
  sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
  window.addEventListener('resize', () => {
    sidebarToggle.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
    if (window.innerWidth > 768) sidebar.classList.remove('open');
  });
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="components/messages/ConversationItem.js"></script>
<script src="components/messages/EmptyState.js"></script>
<script src="components/messages/MessageHeader.js"></script>
<script src="components/messages/MessageComposer.js"></script>
<script src="components/messages/MessageBubble.js"></script>
<script src="components/messages/MessageThread.js"></script>
<script src="components/messages/ConversationList.js"></script>
<script src="components/messages/MessagingLayout.js"></script>
<script src="app.js"></script>
<script src="tutor-mode.js"></script>
</body>
</html>
